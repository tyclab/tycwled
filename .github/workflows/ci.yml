---
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: pip install pre-commit
      # The same target a contributor runs locally: pre-commit over the whole
      # tree plus the repo's own checks (ledmap bytes, generated palettes).
      - run: make lint
      # make lint reads the tree the change ends in; a file added and removed again is only in its commits.
      - name: Check every new commit for private lamp data
        env:
          COMMITS: >-
            ${{ github.event_name == 'pull_request'
            && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
            || format('{0}..{1}', github.event.before, github.sha) }}
        run: python3 tools/check_private_lamp_data.py "$COMMITS"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The private-data test checks that this history starts at the rewritten one.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      # Offline: the palette emulation against known firmware values and the
      # fit's residual bounds. Lamp-side checks (make verify) need hardware.
      - run: make test

  renovate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A renovate.json the validator rejects fails here, not silently at the app's next run. The pin moves on Renovate majors (renovate.json).
      - run: npx --yes --package renovate@44.224.0 renovate-config-validator --strict

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # History, not the working tree: the pre-commit gitleaks hook scans file
      # content and is skippable with --no-verify. Pinned release binary.
      - run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner --log-level error
