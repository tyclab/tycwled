---
name: What I see on my lamp
description: A preset looks different from the factory lamp, or a documented step failed
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Please do not report security vulnerabilities here — see
        [SECURITY.md](https://github.com/tyclab/tycwled/blob/main/SECURITY.md).
  - type: input
    id: firmware
    attributes:
      label: Firmware versions
      description: "`/json/info` → `ver` of every lamp involved."
      placeholder: "ref 0.14.4-GLORB.1.3, target 16.0.1"
    validations:
      required: true
  - type: input
    id: preset
    attributes:
      label: Preset or step
      placeholder: "preset 4 Running - Atlantica / make verify / install"
    validations:
      required: true
  - type: textarea
    id: what-differs
    attributes:
      label: What differs
      description: Motion, colour, brightness, mapping, or what the command printed instead of what the README says.
    validations:
      required: true
  - type: textarea
    id: numbers
    attributes:
      label: Numbers, if you have them
      description: >-
        `python3 wledlab.py analyse …` output or the `make verify` table.
        Redact hostnames if you like; lamp IPs are fine.
      render: text
  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: No Wi-Fi credentials, tokens or private hostnames in this report (a raw cfg.json contains them).
          required: true
