[env:glorb_port]
extends = env:esp32s3dev_8MB_qspi
custom_usermods = audioreactive glorb_fx
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=\"ESP32-S3_8MB_qspi\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  ;; S3 PDM amplitude is low enough that WLED's 32->16bit downscale rounds every
  ;; sample to zero; without this the mic reads silence and GEQ renders black.
  -D I2S_USE_16BIT_SAMPLES
