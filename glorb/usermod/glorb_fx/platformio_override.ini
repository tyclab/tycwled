[env:glorb_port]
extends = env:esp32s3dev_8MB_qspi
custom_usermods = audioreactive glorb_fx
;; With the SDK's 16 KB instruction cache the main loop runs about five times slower than with 32 KB
;; (fleet_glorb on one board, 2026-11-21: 629-663 loops/s against 3,010-3,055). The script moves RAM code
;; out of the second cache bank, defines GLORB_ICACHE_32KB and checks the linked ELF; glorb_fx then
;; switches the cache at start.
extra_scripts = ${scripts_defaults.extra_scripts}
  pre:usermods/glorb_fx/icache_32kb.py
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=\"ESP32-S3_8MB_qspi\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  ;; With 32-bit samples the S3 PDM mic reads silence and GEQ renders black;
  ;; 16-bit samples fix it (measured, cause unproven; see README GLORB facts).
  -D I2S_USE_16BIT_SAMPLES
  ;; The factory PDM microphone filter uses the 80 Hz coefficient at 22,050 Hz.
  -D UM_AUDIOREACTIVE_MIC_FILTER_ALPHA=0.0225f
  ;; Microphone baseline and gain advance on a fixed clock, not once per main-loop pass. On the same board
  ;; and tone sequence, sound transmission off as the lamps run, the Running effect dropped from three to
  ;; two steps at 12.00 and 11.96 s (345 Hz) and 14.57 and 14.49 s (1,378 Hz) on the factory image (two
  ;; runs), at 12.07 s / 14.52 s with 429 us (one run) and at 13.93 s / 16.41 s with 467 us; the
  ;; instruction-cache size does not move this crossing (467 us with 16 KB: 13.95 s / 16.42 s). 467 us had
  ;; been fitted on the factory image while it transmitted its audio values. With sound sync sending this
  ;; build uses the same 429 us; its match to the factory image in that mode is not measured.
  -D UM_AUDIOREACTIVE_PDM_ENVELOPE_PERIOD_US=429
