[env:glorb_port]
extends = env:esp32s3dev_8MB_qspi
custom_usermods = audioreactive glorb_fx
;; The main loop's code does not fit the SDK's 16 KB instruction cache (549 loops/s against 3,022 with
;; 32 KB, measured 2026-11-21). The script moves RAM code out of the second cache bank and defines
;; GLORB_ICACHE_32KB; glorb_fx then switches the cache at start.
extra_scripts = ${scripts_defaults.extra_scripts}
  pre:usermods/glorb_fx/icache_32kb.py
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=\"ESP32-S3_8MB_qspi\"
  -D WLED_WATCHDOG_TIMEOUT=0
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM
  ;; With 32-bit samples the S3 PDM mic reads silence and GEQ renders black;
  ;; 16-bit samples fix it (measured, cause unproven; see README GLORB facts).
  -D I2S_USE_16BIT_SAMPLES
  ;; The factory PDM microphone filter uses the 80 Hz coefficient at 22,050 Hz.
  -D UM_AUDIOREACTIVE_MIC_FILTER_ALPHA=0.0225f
  ;; Microphone baseline and gain advance on a fixed clock, not once per main-loop pass. 429 us is the
  ;; factory image with sound transmission off, as the lamps run: on the same board and tone sequence the
  ;; Running effect dropped from three to two steps at 12.00 s / 14.57 s (345 / 1,378 Hz) on the factory
  ;; image and at 12.07 s / 14.52 s with this value (467 us, fitted with transmission on: 13.95 s / 16.42 s).
  -D UM_AUDIOREACTIVE_PDM_ENVELOPE_PERIOD_US=429
