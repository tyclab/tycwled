---
# Run the same suite locally and in CI with make lint.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      # Scan content one file at a time; upstream git --staged sees nothing under --all-files.
      # Several paths per call silently scan the whole tree. History is CI's gitleaks job.
      - id: gitleaks
        entry: sh -c 'printf "%s\0" "$@" | xargs -0 -n1 -P4 gitleaks dir --redact --verbose --no-banner --log-level error' --
        pass_filenames: true

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: 341e2a331ba578029e66c2e01183e7a6b5ca9ab4 # frozen: v0.24.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 331f33fa4dfbcbca7c3da3620c137fde0faab273 # frozen: v3.9.10
    hooks:
      - id: prettier
        types_or: [markdown, json]
        # Lamp files are byte-exact (ledmaps are scanned raw, palettes and the
        # curtain ledmap are generator output, cfg is the factory dump); never
        # reformat them.
        exclude: ^(glorb/.*|curtain/ledmap)\.json$

  # E9/F check defects without imposing additional style rules.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # frozen: v0.17.1
    hooks:
      - id: ruff-check
        args: [--select, "E9,F"]
