---
# Run the same suite locally and in CI with make lint.

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      # Scan content one file at a time; upstream git --staged sees nothing under --all-files.
      - id: gitleaks
        entry: sh -c 'printf "%s\0" "$@" | xargs -0 -n1 -P4 gitleaks dir --redact --verbose --no-banner --log-level error' --
        pass_filenames: true

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: b82a6c8896e491b9cb377a99ff3412131920681b # frozen: v0.23.2
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: 0ee178619d696787ca73d210cc191d720868c631 # frozen: v3.9.6
    hooks:
      - id: prettier
        types_or: [markdown, json]
        # Lamp files are byte-exact (ledmaps are scanned raw, palettes and the
        # curtain ledmap are generator output, cfg is the factory dump); never
        # reformat them.
        exclude: ^(glorb/.*|curtain/ledmap)\.json$

  # E9/F check defects without imposing additional style rules.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 65dbdb59d2f2d9c3bdc343c566821ad3319ddaa3 # frozen: v0.16.3
    hooks:
      - id: ruff-check
        args: [--select, "E9,F"]
