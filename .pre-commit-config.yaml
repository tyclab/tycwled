---
# Run the same suite locally and in CI with make lint.

repos:
  - repo: local
    hooks:
      - id: private-lamp-data
        name: Keep raw lamp captures and backups private
        entry: python3 tools/check_private_lamp_data.py
        language: system
        pass_filenames: false
        always_run: true

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      # Scan content one file at a time; upstream git --staged sees nothing under --all-files.
      # Several paths per call silently scan the whole tree. History is CI's gitleaks job.
      - id: gitleaks
        entry: sh -c 'printf "%s\0" "$@" | xargs -0 -n1 -P4 gitleaks dir --redact --verbose --no-banner --log-level error' --
        pass_filenames: true

  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530 # frozen: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: c01a1853c19b175aee6a09f24e2ad9b748c485ad # frozen: v0.24.1
    hooks:
      - id: markdownlint-cli2
        language_version: system

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: c035d5c3fc2ce295b961030061d09de67d9203dc # frozen: v3.10.1
    hooks:
      - id: prettier
        language_version: system
        types_or: [markdown, json]
        # Lamp files are byte-exact (ledmaps are scanned raw, palettes and the
        # curtain ledmap are generator output, cfg is the factory dump); never
        # reformat them.
        exclude: ^(glorb/.*|curtain/ledmap)\.json$

  # E9/F check defects without imposing additional style rules.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1 # frozen: v0.17.5
    hooks:
      - id: ruff-check
        args: [--select, "E9,F"]
