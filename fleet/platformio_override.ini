[fleet]
;; The panic-hook define and linker wrap must stay paired.
build_flags = -D SYSLOG_EVENTS_HOST=\"10.27.2.41\" -D SYSLOG_EVENTS_PORT=1515
  -D SYSLOG_EVENTS_PANIC_HOOK -Wl,--wrap=esp_panic_handler

;; Keep stock ESP32 release name so OTA validation accepts these builds.
[env:fleet_esp32]
extends = env:esp32dev
custom_usermods = ${env:esp32dev.custom_usermods} syslog_events
build_flags = ${env:esp32dev.build_flags} ${fleet.build_flags}

;; GL-C-618WL: retain Ethernet/AudioReactive and the ESP32_Ethernet release name.
[env:fleet_gledopto]
extends = env:esp32_eth
custom_usermods = ${env:esp32_eth.custom_usermods} syslog_events
build_flags = ${env:esp32_eth.build_flags} ${fleet.build_flags}

[env:fleet_glorb]
extends = env:glorb_port
custom_usermods = ${env:glorb_port.custom_usermods} syslog_events
build_flags = ${env:glorb_port.build_flags} ${fleet.build_flags}
