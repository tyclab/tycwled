;; The builds our own four lamps run. fleet/build.sh appends this file to
;; glorb/usermod/glorb_fx/platformio_override.ini, because WLED reads exactly one override.

[fleet]
;; 10.27.2.41:1515 is our collector's RFC3164 listener. The panic hook and the linker wrap
;; only work together: the define compiles __wrap_esp_panic_handler, the flag routes to it.
build_flags = -D SYSLOG_EVENTS_HOST=\"10.27.2.41\" -D SYSLOG_EVENTS_PORT=1515
  -D SYSLOG_EVENTS_PANIC_HOOK -Wl,--wrap=esp_panic_handler

;; Couch strip and Moon: the stock "ESP32" release (env:esp32dev with audioreactive) plus
;; syslog. Same release name, so OTA validation passes and nothing else changes.
[env:fleet_esp32]
extends = env:esp32dev
custom_usermods = ${env:esp32dev.custom_usermods} syslog_events
build_flags = ${env:esp32dev.build_flags} ${fleet.build_flags}

;; Both GLORBs: the port build plus syslog.
[env:fleet_glorb]
extends = env:glorb_port
custom_usermods = ${env:glorb_port.custom_usermods} syslog_events
build_flags = ${env:glorb_port.build_flags} ${fleet.build_flags}
